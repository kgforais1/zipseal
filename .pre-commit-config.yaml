# Install once per clone:  pre-commit install
# Run on everything:       pre-commit run --all-files
# Bump pinned revisions:   see "Bumping hook revs" below.
#   Do NOT run pre-commit autoupdate: it rewrites SHAs back to tags.
#
# Bumping hook revs: `rev` must stay a commit SHA, never a tag. For each repo,
# find the newest tag, resolve it to the commit (peeled: for an annotated tag,
# ls-remote lists the tag object first), then update rev and its tag comment
# together:
#   tag=$(git ls-remote --tags --refs https://github.com/<repo> \
#     | sed 's#.*refs/tags/##' | sort -V | tail -1)
#   sha=$(git ls-remote https://github.com/<repo> "refs/tags/$tag" \
#     "refs/tags/$tag^{}" | tail -1 | cut -f1)

repos:
  - repo: local
    hooks:
      - id: check-file-size
        name: "policy: file size"
        entry: python3 hooks/scripts/check_file_size.py
        language: system
        types: [file]

      - id: check-doc-freshness
        name: "policy: doc freshness"
        entry: python3 hooks/scripts/check_doc_freshness.py
        language: system
        types: [markdown]

      - id: check-todo-limits
        name: "policy: TODO size"
        entry: python3 hooks/scripts/check_todo_limits.py
        language: system
        files: '^TODO\.md$'

      - id: check-forbidden-paths
        name: "data: forbidden tracked paths"
        entry: python3 hooks/scripts/check_forbidden_paths.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-gitignore-protected
        name: "data: protected .gitignore rules"
        entry: python3 hooks/scripts/check_gitignore_protected.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-personal-data
        name: "data: home paths and email addresses"
        entry: python3 hooks/scripts/check_personal_data.py
        language: system

      - id: check-pins
        name: "policy: immutable version pins"
        entry: uv run python hooks/scripts/check_pins.py
        language: system
        files: '^(\.pre-commit-config\.yaml|\.github/workflows/[^/]+\.ya?ml)$'
        types: [text]

      - id: basedpyright
        name: "python: basedpyright"
        entry: uv run basedpyright
        language: system
        files: '^(src|tests)/.*\.py$'
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 916ad0aaa108c64d294101002066f530ea170b10  # v0.23.3
    hooks:
      - id: markdownlint-cli2
