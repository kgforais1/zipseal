# Install once per clone:  pre-commit install
# Run on everything:       pre-commit run --all-files
# Bump pinned revisions:   pre-commit autoupdate

repos:
  - repo: local
    hooks:
      - id: check-file-size
        name: "policy: file size"
        entry: python3 hooks/scripts/check_file_size.py
        language: system
        types: [file]

      - id: check-doc-freshness
        name: "policy: doc freshness"
        entry: python3 hooks/scripts/check_doc_freshness.py
        language: system
        types: [markdown]

      - id: check-todo-limits
        name: "policy: TODO size"
        entry: python3 hooks/scripts/check_todo_limits.py
        language: system
        files: '^TODO\.md$'

      - id: check-forbidden-paths
        name: "data: forbidden tracked paths"
        entry: python3 hooks/scripts/check_forbidden_paths.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-gitignore-protected
        name: "data: protected .gitignore rules"
        entry: python3 hooks/scripts/check_gitignore_protected.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-personal-data
        name: "data: home paths and email addresses"
        entry: python3 hooks/scripts/check_personal_data.py
        language: system
        types: [text]

      - id: basedpyright
        name: "python: basedpyright"
        entry: uv run basedpyright
        language: system
        files: '^(src|tests)/.*\.py$'
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
