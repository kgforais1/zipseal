name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Hooks (lint, types, data and secret gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install 7-Zip and bsdtar (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y 7zip libarchive-tools
      - name: Install 7-Zip (macOS)
        if: runner.os == 'macOS'
        run: brew install sevenzip
      - run: uv sync --locked
      - run: uv run pytest -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv export --locked --no-dev --no-hashes --format requirements-txt -o /tmp/req.txt
      - run: uvx pip-audit -r /tmp/req.txt
