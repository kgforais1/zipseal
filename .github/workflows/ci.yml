# uvx: every call passes --no-build and pins an exact version, so a missing
# wheel fails the job instead of silently running an sdist build backend, and a
# new upstream release cannot reach CI unreviewed. See dependency-audit.yml for
# the longer note.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Hooks (lint, types, data and secret gates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.24"
      - run: uv sync --locked
      - run: uvx --no-build pre-commit==4.7.0 run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          version: "0.12.24"
      - name: Install 7-Zip and bsdtar (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y 7zip libarchive-tools
      - name: Install 7-Zip (macOS)
        if: runner.os == 'macOS'
        run: brew install sevenzip
      - run: uv sync --locked
      - run: uv run pytest -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.12.24"
      - run: uv export --locked --no-dev --no-hashes --format requirements-txt -o "$RUNNER_TEMP/req.txt"
      - run: uvx --no-build pip-audit==2.10.1 -r "$RUNNER_TEMP/req.txt"
