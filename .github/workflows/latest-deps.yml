# Weekly run against the newest dependency releases that pyproject.toml allows.
#
# ci.yml installs from uv.lock, so a new upstream release (stream-zip,
# stream-unzip, or the dev tools) cannot break a PR, but it also goes unnoticed
# until someone refreshes the lock. This job re-resolves the lock with
# `uv lock --upgrade` in the runner's checkout only (nothing is committed), then
# runs the fast tests and basedpyright. As in dependency-audit.yml, a failing
# run is the notification. The "Show what moved" step lists the versions that
# differ from uv.lock, so the log says which release to suspect.
#
# The <0.1 caps on stream-zip and stream-unzip still apply: this probes what
# a fresh `pip install zipseal` gets today, not releases past the caps.
#
# Actions usage: ~2 Linux minutes per run; weekly.
#
# GitHub disables scheduled workflows in a public repository after 60 days
# with no repository activity. If that happens, re-enable this workflow from
# the Actions tab.

name: Latest dependencies

on:
  schedule:
    # Thursdays 16:47 UTC, half an hour after the dependency audit.
    - cron: "47 16 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    name: Newest allowed releases (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ci.yml's Python versions. macOS is left to ci.yml: dependency
        # releases rarely break one OS only, and macOS minutes cost 10x.
        python: ["3.11", "3.13"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          version: "0.12.24"
      - name: Install 7-Zip and bsdtar
        run: sudo apt-get update && sudo apt-get install -y 7zip libarchive-tools
      - run: cp uv.lock "$RUNNER_TEMP/uv.lock.committed"
      - run: uv lock --upgrade --no-build
      - name: Show what moved
        run: |
          python3 - "$RUNNER_TEMP/uv.lock.committed" uv.lock <<'EOF'
          import sys
          import tomllib

          # A lock can hold several versions of one package (one per Python range),
          # so compare the full set of versions under each name.
          def versions(path):
              found = {}
              with open(path, "rb") as handle:
                  for p in tomllib.load(handle)["package"]:
                      found.setdefault(p["name"], set()).add(p.get("version", "-"))
              return {name: ", ".join(sorted(v)) for name, v in found.items()}

          old, new = versions(sys.argv[1]), versions(sys.argv[2])
          moved = [(n, old.get(n, "-"), new.get(n, "-")) for n in sorted(old.keys() | new.keys())
                   if old.get(n) != new.get(n)]
          for name, before, after in moved:
              print(f"{name}: {before} -> {after}")
          if not moved:
              print("Nothing differs from uv.lock.")
          EOF
      # --locked holds every step to the lock re-resolved above. --no-build refuses
      # sdists, so no upstream setup script runs; the project itself is therefore
      # not installed but imported from src/ (its entry points are not needed here).
      - run: uv sync --locked --no-build --no-install-project
      - run: uv run --locked --no-build --no-sync pytest -q
        env:
          PYTHONPATH: src
      - run: uv run --locked --no-build --no-sync basedpyright
        env:
          PYTHONPATH: src
