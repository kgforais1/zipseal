[project]
name = "zipseal"
version = "0.3.0"
description = "Write files and folders into AES-256 zips, optionally split into self-contained parts under a size cap."
readme = "README.md"
authors = [
    { name = "kgrizz-git", email = "216068303+kgrizz-git@users.noreply.github.com" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["zip", "encryption", "aes", "archive", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Compression",
]
dependencies = [
    "stream-zip>=0.0.84,<0.1",
    "stream-unzip>=0.0.101,<0.1",
]

[project.urls]
Homepage = "https://github.com/kgforais1/zipseal"
Documentation = "https://github.com/kgforais1/zipseal/tree/main/user-docs"
Changelog = "https://github.com/kgforais1/zipseal/blob/main/CHANGELOG.md"
Issues = "https://github.com/kgforais1/zipseal/issues"

[project.scripts]
zipseal = "zipseal.cli:main"
zipseal-gui = "zipseal.gui:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "basedpyright>=1.20",
    "pyyaml>=6",
]
build = [
    "pyinstaller==6.22.3",
    "pillow==13.0.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = [".DS_Store", "**/.DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not slow and not gui'"
markers = [
    "slow: long-running tests (Zip64, huge entry counts). Run with -m slow.",
    "sevenzip: needs the 7zz binary; skipped when it is missing.",
    "gui: needs a real Tk display. Run with -m gui.",
]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src", "tests", "packaging"]
pythonVersion = "3.11"
