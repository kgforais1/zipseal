# Ruff configuration. The pre-commit hook and any future CI lint step both read
# this file, so local and CI results agree.

target-version = "py311"
line-length = 100
extend-exclude = [".context"]

[lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "S",       # bandit: this tool handles passwords and encryption
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]  # asserts, fixture passwords, running tar
"scripts/**" = ["S105", "S311", "S603", "S607"]  # sample password, seeded noise, running zipseal
"hooks/**" = ["S603", "S607"]  # hooks run git
# The build runs pinned tools by path (resvg, iconutil, and later hdiutil,
# codesign and appimagetool). The download and the unpack are checked in
# icons.py, so the urlopen and tar-extract suppressions are not used.
"packaging/**" = ["S603", "S607"]

[format]
quote-style = "double"
